<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1730"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>片刻 · 私人影音库</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf1ff;background:#091225;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% -10%,#21447a 0,transparent 35%),#091225}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #7bbaff;outline-offset:2px}.shell{max-width:1100px;margin:auto;padding:30px 24px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;border-radius:14px;background:linear-gradient(135deg,#3c9dff,#7557e8);display:grid;place-items:center;font-size:25px;box-shadow:0 8px 30px #3979ec55}.brand h1{margin:0;font-size:24px;letter-spacing:2px}.brand small{color:#91a6c8;font-size:12px}.tools{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #34496b;background:#162843;color:#eaf1ff;border-radius:12px;padding:11px 14px;font-weight:600}.btn:hover{background:#213a5d}.btn.primary{border:0;background:linear-gradient(135deg,#348eff,#5c70ed);box-shadow:0 5px 22px #367dff44}.hero{margin:35px 0 26px;padding:30px;border-radius:26px;background:linear-gradient(115deg,#173c74,#122344 60%,#1e2553);border:1px solid #315287;position:relative;overflow:hidden}.hero:after{content:'▶';position:absolute;right:35px;top:4px;font-size:160px;color:#ffffff0c;pointer-events:none}.eyebrow{color:#8cc6ff;font-size:13px;font-weight:700;letter-spacing:2px}.hero h2{font-size:clamp(25px,4vw,38px);margin:10px 0}.hero p{color:#b5c9e6;max-width:580px;line-height:1.7}.hero .btn{margin-top:10px}.stats{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}.stat{padding:13px 19px;background:#13223b;border:1px solid #253957;border-radius:14px;min-width:115px}.stat b{display:block;font-size:23px}.stat span{color:#94a7c4;font-size:12px}.bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin:30px 0 18px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{background:transparent;border:1px solid transparent;color:#94a8c7;border-radius:10px;padding:10px 12px}.tab.active{background:#1d3659;color:#fff;border-color:#365f93}.search{background:#14233c;border:1px solid #304565;border-radius:12px;color:#fff;padding:11px 14px;min-width:220px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{border:1px solid #263b5a;background:#12213a;border-radius:18px;overflow:hidden;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:#4a78ae}.poster{aspect-ratio:16/9;background:linear-gradient(135deg,#224b83,#332a6e);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.poster .play{position:absolute;width:48px;height:48px;border-radius:50%;background:#091c38bd;border:1px solid #ffffff70;display:grid;place-items:center;font-size:20px}.poster .platform{position:absolute;left:12px;bottom:10px;background:#071326c9;padding:5px 8px;border-radius:7px;font-size:11px}.poster .duration{position:absolute;right:12px;bottom:10px;background:#071326c9;padding:5px 8px;border-radius:7px;font-size:11px}.body{padding:15px}.title{font-weight:700;line-height:1.5;min-height:44px;overflow-wrap:anywhere}.meta{color:#90a7c9;font-size:12px;margin:8px 0 13px}.actions{display:flex;gap:7px;align-items:center}.actions .btn{font-size:12px;padding:8px 10px}.actions .watch{flex:1;background:#24539a;border-color:#3669b2}.more{margin-left:auto}.empty{text-align:center;padding:70px 20px;border:1px dashed #365070;border-radius:20px;color:#9db0ce}.empty .big{font-size:50px;margin-bottom:12px}.empty h3{color:#eaf1ff}.dialog{border:1px solid #42608a;background:#111f37;color:#f0f5ff;border-radius:22px;width:min(94vw,520px);padding:24px;box-shadow:0 25px 100px #0009}.dialog::backdrop{background:#020917cc}.dialog h2{margin:0 0 17px}.field{display:block;margin:12px 0;color:#acc0df;font-size:13px}.field input,.field select,.field textarea{display:block;margin-top:7px;width:100%;background:#0a172b;border:1px solid #354b6b;border-radius:10px;padding:12px;color:#fff}.field textarea{resize:vertical;min-height:65px}.dialog footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.hint{color:#91a8c8;font-size:12px;line-height:1.6}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2c5487;color:#fff;border-radius:12px;padding:12px 20px;box-shadow:0 10px 30px #0008;display:none;z-index:9}.footer{text-align:center;color:#6e86a9;font-size:12px;margin:35px 0}@media(max-width:760px){.shell{padding:20px 15px 70px}.top{align-items:flex-start}.top .tools{justify-content:flex-end}.tools .btn{padding:9px}.hero{margin-top:25px;padding:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.body{padding:11px}.title{font-size:13px}.actions{flex-wrap:wrap}.actions .btn{font-size:11px}.search{width:100%}.bar{align-items:stretch}.tabs{width:100%;overflow-x:auto;flex-wrap:nowrap}.tab{white-space:nowrap}.stat{flex:1;min-width:85px}.brand h1{font-size:21px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.top{flex-wrap:wrap}.top .tools{width:100%;justify-content:flex-start}.hero:after{right:-30px}.stats{gap:7px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo">▶</div><div><h1>片刻</h1><small>收藏值得看的每一刻</small></div></div><div class="tools"><button class="btn" id="exportBtn">↓ 备份</button><button class="btn" id="importBtn">↑ 导入</button><button class="btn primary" id="addBtn">＋ 收藏视频</button></div></header><section class="hero"><div class="eyebrow">YOUR OWN WATCHLIST</div><h2>想放松，就看点真正想看的。</h2><p>不追着算法跑。把 B站、YouTube、影视剧和喜欢的长视频收进这里，空闲时打开自己的片单。</p><button class="btn primary" id="randomBtn">✦ 从收藏里随机挑一个</button></section><section class="stats"><div class="stat"><b id="countAll">0</b><span>全部收藏</span></div><div class="stat"><b id="countTodo">0</b><span>想看</span></div><div class="stat"><b id="countDoing">0</b><span>正在看</span></div><div class="stat"><b id="countDone">0</b><span>已看完</span></div></section><section class="bar"><nav class="tabs" aria-label="筛选视频"><button class="tab active" data-filter="all">全部</button><button class="tab" data-filter="todo">想看</button><button class="tab" data-filter="doing">正在看</button><button class="tab" data-filter="done">已看完</button></nav><input class="search" id="search" placeholder="⌕ 搜索标题、标签或平台" aria-label="搜索视频"></section><section id="grid" class="grid" aria-live="polite"></section><p class="footer">数据保存在当前浏览器 · 请定期导出 JSON 备份 · 片刻 v1.0</p></main><dialog class="dialog" id="editor"><form id="videoForm"><h2 id="dialogTitle">收藏视频</h2><label class="field">视频链接 *<input type="url" id="url" required placeholder="https://..."></label><label class="field">标题 *<input id="title" required maxlength="150" placeholder="给这段视频起个名字"></label><label class="field">封面图片地址（可选）<input type="url" id="cover" placeholder="YouTube 链接可自动生成封面"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="field">平台<select id="platform"><option value="auto">自动识别</option><option>B站</option><option>YouTube</option><option>影视剧</option><option>其他</option></select></label><label class="field">状态<select id="status"><option value="todo">想看</option><option value="doing">正在看</option><option value="done">已看完</option></select></label></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="field">时长（可选）<input id="duration" maxlength="20" placeholder="例如 45分钟"></label><label class="field">标签（可选）<input id="tag" maxlength="30" placeholder="例如 访谈"></label></div><label class="field">备注 / 观看进度（可选）<textarea id="notes" placeholder="例如：看到第 23 分钟"></textarea></label><p class="hint">支持任何合法视频播放页面的链接。第一版通过原平台播放；部分平台不支持自动提取标题、封面或播放进度。</p><footer><button type="button" class="btn" id="cancelBtn">取消</button><button type="submit" class="btn primary">保存收藏</button></footer></form></dialog><input type="file" id="fileInput" accept=".json,application/json" hidden><div class="toast" id="toast" role="status"></div><script>
(()=>{'use strict';const KEY='pianke_v1_items';let items=[];let filter='all';let editId=null;const $=id=>document.getElementById(id);const fields=['url','title','cover','platform','status','duration','tag','notes'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=s=>{const e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',2600)};function safeUrl(u){try{let v=new URL(u);return ['http:','https:'].includes(v.protocol)?v.href:''}catch{return ''}}function platform(u){try{const h=new URL(u).hostname.toLowerCase();if(h==='youtu.be'||h==='youtube.com'||h.endsWith('.youtube.com'))return 'YouTube';if(h==='bilibili.com'||h.endsWith('.bilibili.com')||h==='b23.tv')return 'B站';return '其他'}catch{return '其他'}}function ytCover(u){try{const x=new URL(u);let id='';if(x.hostname==='youtu.be')id=x.pathname.split('/')[1];else if(x.hostname.endsWith('youtube.com'))id=x.searchParams.get('v')||(x.pathname.match(/\/(?:shorts|embed|live)\/([^/?]+)/)||[])[1];return /^[\w-]{11}$/.test(id||'')?'https://img.youtube.com/vi/'+id+'/hqdefault.jpg':''}catch{return ''}}function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');items=Array.isArray(v)?v.filter(x=>x&&safeUrl(x.url)).map(normalize):[]}catch{items=[];toast('读取本地数据失败，请尝试导入备份')}}function normalize(x){return {id:String(x.id||crypto.randomUUID()),url:safeUrl(x.url),title:String(x.title||'未命名视频').slice(0,150),cover:safeUrl(x.cover||''),platform:['B站','YouTube','影视剧','其他'].includes(x.platform)?x.platform:platform(x.url),status:['todo','doing','done'].includes(x.status)?x.status:'todo',duration:String(x.duration||'').slice(0,20),tag:String(x.tag||'').slice(0,30),notes:String(x.notes||'').slice(0,500),createdAt:x.createdAt||new Date().toISOString()}}function save(){try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch{toast('保存失败：浏览器空间不足或禁用了存储');return false}}function render(){const counts={all:items.length,todo:0,doing:0,done:0};items.forEach(x=>counts[x.status]++);for(const k of ['All','Todo','Doing','Done'])$('count'+k).textContent=counts[k.toLowerCase()];document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));const q=$('search').value.trim().toLowerCase();const arr=items.filter(x=>(filter==='all'||x.status===filter)&&[x.title,x.tag,x.platform,x.notes].join(' ').toLowerCase().includes(q)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));const grid=$('grid');if(!arr.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="big">🎬</div><h3>'+(items.length?'这里暂时没有匹配的视频':'你的私人片单，从第一条开始')+'</h3><p>'+(items.length?'试试切换筛选条件':'把你真正想看的视频收藏进来，下次休息就不用漫无目的地找了。')+'</p><button class="btn primary" id="emptyAdd">＋ 收藏第一条视频</button></div>';$('emptyAdd').onclick=()=>openEditor();return}grid.innerHTML=arr.map(x=>{const cover=x.cover||ytCover(x.url);return '<article class="card"><div class="poster">'+(cover?'<img loading="lazy" src="'+esc(cover)+'" alt="" onerror="this.style.display=\'none\'">':'<span style="font-size:54px;opacity:.5">▶</span>')+'<div class="play">▶</div><span class="platform">'+esc(x.platform)+'</span>'+(x.duration?'<span class="duration">'+esc(x.duration)+'</span>':'')+'</div><div class="body"><div class="title">'+esc(x.title)+'</div><div class="meta">'+esc(({todo:'想看',doing:'正在看',done:'已看完'})[x.status])+(x.tag?' · #'+esc(x.tag):'')+'</div><div class="actions"><button class="btn watch" data-action="watch" data-id="'+esc(x.id)+'">▶ 去观看</button><button class="btn" data-action="next" data-id="'+esc(x.id)+'">'+(x.status==='todo'?'开始看':x.status==='doing'?'标记看完':'重新想看')+'</button><button class="btn more" data-action="edit" data-id="'+esc(x.id)+'" aria-label="编辑">⋯</button></div></div></article>'}).join('')}function openEditor(x){editId=x?.id||null;$('dialogTitle').textContent=x?'编辑收藏':'收藏视频';fields.forEach(f=>$(f).value=x?.[f]??(f==='platform'?'auto':f==='status'?'todo':''));$('editor').showModal()}function closeEditor(){$('editor').close()}$('addBtn').onclick=()=>openEditor();$('cancelBtn').onclick=closeEditor();$('editor').addEventListener('click',e=>{if(e.target===$('editor'))closeEditor()});$('url').addEventListener('change',()=>{if(!editId&&$('title').value===''){$('title').placeholder='输入视频标题（链接不一定能自动识别）'} });$('videoForm').onsubmit=e=>{e.preventDefault();const raw=Object.fromEntries(fields.map(f=>[f,$(f).value.trim()]));if(!safeUrl(raw.url)){toast('请输入有效的 http(s) 视频链接');return}if(!raw.title){toast('请填写标题');return}raw.platform=raw.platform==='auto'?platform(raw.url):raw.platform;const old=items.find(x=>x.id===editId);const v=normalize({...old,...raw,id:editId||crypto.randomUUID(),createdAt:old?.createdAt||new Date().toISOString()});if(editId)items=items.map(x=>x.id===editId?v:x);else items.unshift(v);if(save()){closeEditor();render();toast(editId?'已更新收藏':'收藏成功')}};$('grid').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;const x=items.find(y=>y.id===b.dataset.id);if(!x)return;if(b.dataset.action==='watch'){if(x.status==='todo'){x.status='doing';save();render()}window.open(x.url,'_blank','noopener,noreferrer');return}if(b.dataset.action==='next'){x.status=x.status==='todo'?'doing':x.status==='doing'?'done':'todo';save();render();return}if(b.dataset.action==='edit'){const action=prompt('输入 1 编辑，2 删除，其他取消','1');if(action==='1')openEditor(x);if(action==='2'&&confirm('确定删除「'+x.title+'」吗？')){items=items.filter(y=>y.id!==x.id);save();render();toast('已删除')}}};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$('search').oninput=render;$('randomBtn').onclick=()=>{const pool=items.filter(x=>x.status!=='done');if(!pool.length){toast('先收藏一些想看的视频吧');return}const x=pool[Math.floor(Math.random()*pool.length)];if(confirm('随机选中了：\n「'+x.title+'」\n\n现在打开观看？')){if(x.status==='todo'){x.status='doing';save();render()}window.open(x.url,'_blank','noopener,noreferrer')}};$('exportBtn').onclick=()=>{const payload={app:'片刻',version:1,exportedAt:new Date().toISOString(),items};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='片刻备份-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出备份')};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error('文件超过 5MB');const obj=JSON.parse(await f.text());if(obj.app!=='片刻'||!Array.isArray(obj.items))throw Error('不是有效的片刻备份');const incoming=obj.items.filter(x=>x&&safeUrl(x.url)).map(normalize);if(!confirm('将导入 '+incoming.length+' 条视频，并按链接合并去重。继续吗？'))return;const urls=new Set(items.map(x=>x.url));for(const x of incoming)if(!urls.has(x.url)){items.push(x);urls.add(x.url)}if(save()){render();toast('导入成功，共 '+items.length+' 条收藏')}}catch(err){toast('导入失败：'+err.message)}finally{e.target.value=''}};load();render()})();
</script></body></html>
